services:
  - type: web
    name: wealthkeeper-ai-gateway
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEFAULT_PROVIDER
        value: deepseek
      - key: DEFAULT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_DEFAULT_MODEL
        value: deepseek-chat
      - key: WEALTHKEEPER_GATEWAY_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
